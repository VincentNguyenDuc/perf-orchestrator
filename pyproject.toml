[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-orchestrator"
version = "0.1.0"
description = "Reusable orchestrator for Linux perf"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
